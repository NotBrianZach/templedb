# tmux.conf — TempleDB canonical
#
# Source of truth: templedb project, file `config/tmux.conf`.
# Deployed to ~/.config/tmux/tmux.conf via home-manager on all personal
# machines. Also loaded on-demand by `templedb ai vibe start --tmux` for
# users who don't want tmux around their normal shells.
#
# Design rationale: reports/2026-08-14-tmux-scrollback-for-claude-tui.html

# --- Prefix: Ctrl-Space (no xmonad or bash/readline conflict) ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Copy mode: the reason we set this up (scrollback in TUIs) ---
bind Escape copy-mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# --- Mouse: wheel-up auto-enters copy mode inside TUIs, keystroke exits ---
set -g mouse on

# --- Scrollback ---
set -g history-limit 100000

# --- Shell: NixOS has no /bin/sh; use the login shell explicitly so tmux
#     doesn't fall back to a nonexistent /bin/sh when spawning panes. ---
set -g default-command "$SHELL"

# --- Terminal: preserve Claude Code's true-color rendering ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"

# --- Small quality-of-life ---
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g allow-rename off

# --- Config reload ---
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
