[pytest]
# Pytest configuration for TempleDB

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ensure `src/` is on sys.path so tests can `import agent.store` etc.
# without each conftest doing its own sys.path.insert.
#
# `tests` is here for a second, less obvious reason. Seven modules do
# `from conftest import checkout_project, query_one, ...` to reach the
# shared helpers. Under --import-mode=importlib (set below, and correctly
# so) pytest does NOT add test directories to sys.path, so that import
# raised ModuleNotFoundError at COLLECTION time -- test_concurrent,
# test_constraints, test_safe_file_queries, test_safe_queries,
# test_snapshot, test_transactions and test_workflow never ran at all.
# Ten modules erroring during collection reads like noise in the summary
# rather than like coverage silently missing, which is how it survived.
#
# Order matters: `src` precedes `tests`, so nothing under tests/ can
# shadow a real module. Only conftest.py sits directly in tests/ and
# there is no src/conftest.py, so there is no collision to begin with.
pythonpath = src tests

# `importlib` import mode: don't auto-import test dirs as packages.
# Without this, pytest treats tests/agent/ as a package named `agent`,
# which shadows src/agent/ and every `from agent.store import ...`
# fails with ModuleNotFoundError. Passed via addopts below (the option
# name in pytest.ini is `--import-mode`, not a bare `importmode` key).
# See https://docs.pytest.org/en/stable/explanation/pythonpath.html

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --import-mode=importlib

# Markers for test organization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    workflow: marks tests as workflow tests
    concurrent: marks tests as concurrency tests
    constraints: marks tests as constraint validation tests

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/test_output.log
log_file_level = DEBUG

# Coverage (if pytest-cov is installed)
# addopts = --cov=src --cov-report=html --cov-report=term

# Timeout (if pytest-timeout is installed)
# timeout = 300

# Parallel execution (if pytest-xdist is installed)
# addopts = -n auto
