[pytest]
# Pytest configuration for TempleDB

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ensure `src/` is on sys.path so tests can `import agent.store` etc.
# without each conftest doing its own sys.path.insert.
pythonpath = src

# `importlib` import mode: don't auto-import test dirs as packages.
# Without this, pytest treats tests/agent/ as a package named `agent`,
# which shadows src/agent/ and every `from agent.store import ...`
# fails with ModuleNotFoundError. Passed via addopts below (the option
# name in pytest.ini is `--import-mode`, not a bare `importmode` key).
# See https://docs.pytest.org/en/stable/explanation/pythonpath.html

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --import-mode=importlib

# Markers for test organization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    workflow: marks tests as workflow tests
    concurrent: marks tests as concurrency tests
    constraints: marks tests as constraint validation tests

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/test_output.log
log_file_level = DEBUG

# Coverage (if pytest-cov is installed)
# addopts = --cov=src --cov-report=html --cov-report=term

# Timeout (if pytest-timeout is installed)
# timeout = 300

# Parallel execution (if pytest-xdist is installed)
# addopts = -n auto
